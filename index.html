<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mapa de Endereços — Floresta PR</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --bg: #f4f7f9; --surface: #ffffff; --accent: #f0a500; --text: #1a2332; --muted: #64748b; }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{height:100vh; display:flex; flex-direction:column; font-family:'DM Sans',sans-serif; background:var(--bg);}
        header{height:60px; background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 20px; border-bottom:1px solid #ddd;}
        .tabs{height:50px; background:#fff; display:flex; border-bottom:1px solid #ddd; padding:0 20px;}
        .tab{padding:0 20px; display:flex; align-items:center; cursor:pointer; font-weight:bold; color:var(--muted); border-bottom:3px solid transparent;}
        .tab.active{color:var(--accent); border-bottom-color:var(--accent);}
        .content{flex:1; display:none; overflow:hidden;}
        .content.active{display:flex;}
        .sidebar{width:300px; border-right:1px solid #ddd; background:#fff; display:flex; flex-direction:column;}
        .list{flex:1; overflow-y:auto;}
        .list-item{padding:15px; border-bottom:1px solid #eee; cursor:pointer;}
        .list-item:hover{background:#f9f9f9;}
        .item-esquina{font-size:0.75rem; color:#e05c2a; font-weight:bold; margin-top:4px;}
        #map-geral{flex:1;}
        .bairros-scroll{flex:1; overflow-y:auto; padding:20px;}
        .grupo-card{background:#fff; border-radius:10px; border:1px solid #ddd; margin-bottom:30px; overflow:hidden;}
        .endtable{width:100%; border-collapse:collapse; font-size:0.8rem;}
        .endtable th{background:#f8f9fa; padding:10px; text-align:left; border-bottom:2px solid #eee;}
        .endtable td{padding:10px; border-bottom:1px solid #eee;}
        .btn-pdf{padding:8px 15px; background:var(--accent); border:none; border-radius:5px; cursor:pointer; font-weight:bold;}
    </style>
</head>
<body>

<header>
    <div style="font-weight:800; font-family:'Syne';">📍 MAPA FLORESTA PR</div>
    <div style="font-size:0.8rem; color:var(--muted);">Última Atualização: <span id="updateDate">...</span></div>
</header>

<div class="tabs">
    <div class="tab active" onclick="switchTab('geral', this)">Visão Geral</div>
    <div class="tab" onclick="switchTab('bairros', this)">Por Bairro / PDF</div>
</div>

<div id="panel-geral" class="content active">
    <div class="sidebar">
        <div style="padding:15px;"><input type="text" id="search" placeholder="Buscar..." style="width:100%; padding:8px;" oninput="filtrar()"></div>
        <div id="listaGeral" class="list"></div>
    </div>
    <div id="map-geral"></div>
</div>

<div id="panel-bairros" class="content">
    <div class="bairros-scroll" id="bairrosScroll"></div>
</div>

<script>
const SHEET_ID = '1i8jO65wCCTW_R2FcY-O0f_EvOEqOq2BYFTplZtw8kU8';
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0&range=A:G`;

let todosEnderecos = [];
let mapGeral = L.map('map-geral').setView([-23.608, -52.087], 14);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(mapGeral);

async function carregar() {
    try {
        const r = await fetch(CSV_URL + '&cache=' + Date.now());
        const text = await r.text();
        const linhas = text.split('\n').map(l => l.split(',').map(c => c.replace(/"/g,'').trim()));

        document.getElementById('updateDate').textContent = linhas[1][5] || '---';

        todosEnderecos = linhas.slice(1).map((c, i) => ({
            id: i,
            endereco: c[0],
            bairro: c[1],
            esquina: c[6] || '', // COLUNA G (ÍNDICE 6)
            lat: parseFloat(c[3].replace(',','.')),
            lng: parseFloat(c[4].replace(',','.'))
        })).filter(d => !isNaN(d.lat));

        renderLista(todosEnderecos);
        renderMarcadores(todosEnderecos);
    } catch (e) { alert("Erro ao carregar dados da planilha."); }
}

function renderLista(dados) {
    document.getElementById('listaGeral').innerHTML = dados.map(d => `
        <div class="list-item" onclick="mapGeral.setView([${d.lat},${d.lng}], 18)">
            <strong>${d.endereco}</strong><br>
            <small>${d.bairro}</small>
            ${d.esquina ? `<div class="item-esquina">⤷ Esq. com: ${d.esquina}</div>` : ''}
        </div>
    `).join('');
}

function renderMarcadores(dados) {
    dados.forEach(d => {
        L.marker([d.lat, d.lng]).addTo(mapGeral).bindPopup(`<b>${d.endereco}</b><br>Esq: ${d.esquina || '---'}`);
    });
}

function renderBairros() {
    const container = document.getElementById('bairrosScroll');
    container.innerHTML = '';
    const grupos = {};
    todosEnderecos.forEach(d => { if(!grupos[d.bairro]) grupos[d.bairro] = []; grupos[d.bairro].push(d); });

    Object.entries(grupos).forEach(([bairro, items]) => {
        const card = document.createElement('div');
        card.className = 'grupo-card';
        card.innerHTML = `
            <div style="padding:15px; background:#f8f9fa; display:flex; justify-content:space-between; align-items:center;">
                <strong>${bairro}</strong>
                <button class="btn-pdf" onclick="gerarPDF(this, '${bairro}')">Baixar PDF</button>
            </div>
            <table class="endtable">
                <thead><tr><th>Endereço</th><th>Esquina com</th></tr></thead>
                <tbody>${items.map(i => `<tr><td>${i.endereco}</td><td>${i.esquina || '---'}</td></tr>`).join('')}</tbody>
            </table>`;
        container.appendChild(card);
    });
}

async function gerarPDF(btn, bairro) {
    const originalText = btn.innerText;
    btn.innerText = "Gerando...";
    const items = todosEnderecos.filter(d => d.bairro === bairro);
    const html = `
        <div style="padding:20px; font-family:sans-serif;">
            <h2>Mapa: ${bairro}</h2>
            <table style="width:100%; border-collapse:collapse; margin-top:20px;">
                <thead><tr style="background:#eee;">
                    <th style="border:1px solid #ddd; padding:8px; text-align:left;">Endereço</th>
                    <th style="border:1px solid #ddd; padding:8px; text-align:left;">Esquina com</th>
                </tr></thead>
                <tbody>${items.map(i => `<tr>
                    <td style="border:1px solid #ddd; padding:8px;">${i.endereco}</td>
                    <td style="border:1px solid #ddd; padding:8px;">${i.esquina || '---'}</td>
                </tr>`).join('')}</tbody>
            </table>
        </div>`;
    await html2pdf().from(html).set({filename: `Mapa_${bairro}.pdf`}).save();
    btn.innerText = originalText;
}

function switchTab(tab, el) {
    document.querySelectorAll('.tab, .content').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('panel-' + tab).classList.add('active');
    if(tab === 'bairros') renderBairros();
}

carregar();
</script>
</body>
</html>
