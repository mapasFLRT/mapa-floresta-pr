<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><title>Mapa Floresta PR</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #topo { padding: 15px; background: #2c3e50; color: white; display: flex; justify-content: space-between; }
        #conteudo { display: flex; flex: 1; overflow: hidden; }
        #lista { width: 350px; overflow-y: auto; border-right: 1px solid #ccc; padding: 10px; }
        #mapa { flex: 1; }
        .item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        .item:hover { background: #f9f9f9; }
        .esquina-texto { color: #d35400; font-weight: bold; font-size: 0.85em; margin-top: 5px; display: block; }
    </style>
</head>
<body>

<div id="topo">
    <b>📍 MAPA DE LOGÍSTICA - FLORESTA PR</b>
    <span id="status">Carregando...</span>
</div>

<div id="conteudo">
    <div id="lista"></div>
    <div id="mapa"></div>
</div>

<script>
// URL Forçada para ignorar qualquer cache
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1i8jO65wCCTW_R2FcY-O0f_EvOEqOq2BYFTplZtw8kU8/export?format=csv&gid=0&t=' + Date.now();

let mapa = L.map('mapa').setView([-23.608, -52.087], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);

async function carregar() {
    try {
        const resposta = await fetch(SHEET_URL);
        const csv = await resposta.text();
        
        // Converte CSV em Array (Matriz)
        const linhas = csv.split('\n').map(l => l.split(',').map(c => c.replace(/"/g,'').trim()));
        const cabecalho = linhas[0];
        
        // ACHA A COLUNA PELO NOME (Não importa a posição)
        const idxEnd = cabecalho.findIndex(h => h.toLowerCase().includes('endere'));
        const idxBairro = cabecalho.findIndex(h => h.toLowerCase().includes('bairro'));
        const idxLat = cabecalho.findIndex(h => h.toLowerCase().includes('lat'));
        const idxLng = cabecalho.findIndex(h => h.toLowerCase().includes('lng') || h.toLowerCase().includes('lon'));
        const idxEsq = cabecalho.findIndex(h => h.toLowerCase().includes('esquina'));

        console.log("Índices encontrados:", {idxEnd, idxBairro, idxEsq});

        const listaDiv = document.getElementById('lista');
        listaDiv.innerHTML = '';

        linhas.slice(1).forEach(col => {
            if (!col[idxLat]) return;

            const dados = {
                rua: col[idxEnd],
                bairro: col[idxBairro],
                esquina: idxEsq !== -1 ? col[idxEsq] : '',
                lat: parseFloat(col[idxLat].replace(',','.')),
                lng: parseFloat(col[idxLng].replace(',','.'))
            };

            // Adiciona na Lista Lateral
            const item = document.createElement('div');
            item.className = 'item';
            item.innerHTML = `
                <b>${dados.rua}</b><br>
                <small>${dados.bairro}</small>
                ${dados.esquina ? `<span class="esquina-texto">⤷ Esq. com: ${dados.esquina}</span>` : ''}
            `;
            item.onclick = () => mapa.setView([dados.lat, dados.lng], 18);
            listaDiv.appendChild(item);

            // Adiciona no Mapa
            L.marker([dados.lat, dados.lng])
             .addTo(mapa)
             .bindPopup(`<b>${dados.rua}</b><br>Esquina: ${dados.esquina || 'Não informada'}`);
        });

        document.getElementById('status').innerText = 'Dados Atualizados';
    } catch (erro) {
        document.getElementById('status').innerText = 'Erro ao carregar';
        console.error(erro);
    }
}

carregar();
</script>
</body>
</html>
