<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mapa de Endereços — Floresta PR</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg: #f4f7f9; --surface: #ffffff; --surface2: #f8f9fa;
            --border: #dce3e8; --border2: #c4ced6;
            --accent: #f0a500; --accent2: #e05c2a; --accent3: #0891b2;
            --text: #1a2332; --muted: #64748b; --muted2: #475569;
            --ok: #28a745; --tab-h: 52px; --header-h: 64px;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{height:100vh; overflow:hidden; background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif;}
        header{height:var(--header-h); display:flex; align-items:center; justify-content:space-between; padding:0 24px; background:var(--surface); border-bottom:1px solid var(--border); z-index:200;}
        .brand{display:flex; align-items:center; gap:12px;}
        .brand-icon{width:38px; height:38px; border-radius:8px; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; font-size:20px;}
        .brand-name{font-family:'Syne',sans-serif; font-weight:800; font-size:1.1rem;}
        .brand-name em{color:var(--accent); font-style:normal;}
        .header-right{display:flex; align-items:center; gap:20px;}
        .update-badge{display:flex; align-items:center; gap:7px; background:var(--surface2); border:1px solid var(--border2); border-radius:6px; padding:5px 12px; font-size:.78rem;}
        .tabs{height:var(--tab-h); display:flex; background:var(--surface); border-bottom:1px solid var(--border); padding:0 24px;}
        .tab{display:flex; align-items:center; padding:0 18px; font-size:.84rem; cursor:pointer; border-bottom:2px solid transparent;}
        .tab.active{color:var(--accent); border-bottom-color:var(--accent);}
        .app-body{height:calc(100vh - var(--header-h) - var(--tab-h)); display:flex; flex-direction:column;}
        .panel{display:none; flex:1; overflow:hidden;}
        .panel.active{display:flex;}
        .sidebar{width:290px; border-right:1px solid var(--border); display:flex; flex-direction:column; background:var(--surface);}
        .list{flex:1; overflow-y:auto;}
        .map-wrap{flex:1; position:relative;}
        #map-geral{width:100%; height:100%;}
        .filter-bar{padding:8px 18px; border-bottom:1px solid var(--border); display:flex; gap:6px; flex-wrap:wrap;}
        .filter-btn{padding:3px 10px; border-radius:20px; border:1px solid var(--border2); font-size:.72rem; cursor:pointer;}
        .filter-btn.active{background:rgba(8,145,178,0.1); border-color:var(--accent3); color:var(--accent3);}
        /* Estilos de Cartão no Painel de Bairros */
        .bairros-scroll{flex:1; overflow-y:auto; padding:20px;}
        .grupo-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:28px; overflow:hidden;}
        .grupo-header{padding:14px 20px; background:var(--surface2); display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border);}
        .grupo-map{height:320px; width:100%;}
        .btn-pdf{padding:6px 12px; background:rgba(240,165,0,0.1); border:1px solid var(--accent); color:var(--accent); border-radius:6px; cursor:pointer; font-size:12px;}
        table.endtable{width:100%; border-collapse:collapse; font-size:12px;}
        table.endtable th, table.endtable td{padding:10px; border-bottom:1px solid var(--border); text-align:left;}
    </style>
</head>
<body>

<header>
    <div class="brand">
        <div class="brand-icon">📍</div>
        <div class="brand-name">Mapa <em>Floresta</em> PR</div>
    </div>
    <div class="header-right">
        <div class="update-badge">
            <span class="label">Última atualização:</span>
            <span class="date" id="updateDate">—</span>
        </div>
        <div id="statusText" style="font-size:12px; color:var(--muted);">Carregando...</div>
    </div>
</header>

<div class="tabs">
    <div class="tab active" id="tab-geral" onclick="switchTab('geral')">🗺️ Visão Geral</div>
    <div class="tab" id="tab-bairros" onclick="switchTab('bairros')">🏘️ Por Bairro / PDF</div>
</div>

<div class="app-body">
    <div class="panel active" id="panel-geral">
        <div class="sidebar">
            <div style="padding:15px; border-bottom:1px solid var(--border);">
                <input type="text" id="searchGeral" placeholder="Buscar endereço..." oninput="filtrarGeral()" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border);">
            </div>
            <div class="filter-bar" id="filterBar"></div>
            <div class="list" id="listaGeral"></div>
        </div>
        <div class="map-wrap">
            <div id="map-geral"></div>
        </div>
    </div>

    <div class="panel" id="panel-bairros">
        <div style="padding:10px 24px; border-bottom:1px solid var(--border); background:#fff;">
            <select id="bairroSelect" onchange="renderBairros()" style="padding:8px; border-radius:6px; min-width:200px;">
                <option value="">Todos os bairros</option>
            </select>
        </div>
        <div class="bairros-scroll" id="bairrosScroll"></div>
    </div>
</div>

<script>
const SHEET_ID = '1k5wdMKhvl5Klz_dX5iKmR5_n2uJlrqXy3bPrhA3rQYg';
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0&cachebuster=`;

let todosEnderecos = [];
let mapGeral = null;
let marcadoresGeral = [];
let mapsBairro = {};

// Função de Ícone Personalizada Original
function pinIcon(num, color='#f0a500') {
    return L.divIcon({
        className:'',
        html:`<svg width="30" height="42" viewBox="0 0 30 42" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="15" cy="40" rx="6" ry="2" fill="rgba(0,0,0,.35)"/>
            <path d="M15 0C7.82 0 2 5.82 2 13c0 10 13 27 13 27s13-17 13-27C28 5.82 22.18 0 15 0z" fill="${color}" stroke="#fff" stroke-width="1.5"/>
            <circle cx="15" cy="13" r="7" fill="#fff" fill-opacity=".92"/>
            <text x="15" y="17" text-anchor="middle" fill="${color}" font-size="8" font-weight="800" font-family="monospace">${num}</text>
        </svg>`,
        iconSize:[30,42], iconAnchor:[15,42], popupAnchor:[0,-42]
    });
}

async function carregarDados() {
    try {
        const r = await fetch(CSV_URL + Date.now());
        const csv = await r.text();
        const linhas = csv.split('\n').map(l => l.split(','));

        let dataMaisRecente = "";
        let maxDateObj = new Date(0);

        const dados = linhas.slice(1).map((c, i) => {
            const dataStr = (c[5]||"").trim();
            if(dataStr.includes('/')) {
                const [d, m, y] = dataStr.split('/');
                const currentObj = new Date(y, m-1, d);
                if(currentObj > maxDateObj) {
                    maxDateObj = currentObj;
                    dataMaisRecente = dataStr;
                }
            }
            return {
                _idx: i,
                endereco: c[0] || '',
                bairro: c[1] || '',
                esquina: c[6] || '',
                lat: parseFloat(c[3]),
                lng: parseFloat(c[4])
            };
        }).filter(d => d.endereco && d.lat);

        todosEnderecos = dados;
        document.getElementById('updateDate').textContent = dataMaisRecente;
        document.getElementById('statusText').textContent = dados.length + " endereços";
        
        popularFiltros(dados);
        popularSelectBairro(dados);
        renderGeralMarcadores(dados);
        renderGeralLista(dados);
    } catch (e) { console.error(e); }
}

function renderGeralMarcadores(dados) {
    marcadoresGeral.forEach(m => mapGeral.removeLayer(m));
    marcadoresGeral = [];
    dados.forEach((item, i) => {
        const m = L.marker([item.lat, item.lng], { icon: pinIcon(i+1) }).addTo(mapGeral);
        m.bindPopup(`<b>${item.endereco}</b><br>${item.bairro}`);
        marcadoresGeral.push(m);
    });
    if(dados.length) mapGeral.fitBounds(L.latLngBounds(dados.map(d => [d.lat, d.lng])));
}

function renderGeralLista(dados) {
    const container = document.getElementById('listaGeral');
    container.innerHTML = dados.map((item, i) => `
        <div style="padding:12px; border-bottom:1px solid #eee; cursor:pointer;" onclick="mapGeral.setView([${item.lat},${item.lng}], 17)">
            <div style="font-weight:bold; font-size:13px;">${i+1}. ${item.endereco}</div>
            <div style="font-size:11px; color:#666;">${item.bairro} ${item.esquina ? '• Esq. '+item.esquina : ''}</div>
        </div>
    `).join('');
}

function popularFiltros(dados) {
    const bairros = [...new Set(dados.map(d => d.bairro))].sort();
    document.getElementById('filterBar').innerHTML = `<button class="filter-btn active" onclick="filtrarBairro(this, '')">Tudo</button>` + 
        bairros.map(b => `<button class="filter-btn" onclick="filtrarBairro(this, '${b}')">${b}</button>`).join('');
}

function filtrarBairro(btn, bairro) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filtrados = bairro ? todosEnderecos.filter(d => d.bairro === bairro) : todosEnderecos;
    renderGeralMarcadores(filtrados);
    renderGeralLista(filtrados);
}

function popularSelectBairro(dados) {
    const bairros = [...new Set(dados.map(d => d.bairro))].sort();
    const sel = document.getElementById('bairroSelect');
    sel.innerHTML = '<option value="">Todos os bairros</option>' + bairros.map(b => `<option value="${b}">${b}</option>`).join('');
}

function renderBairros() {
    const filtro = document.getElementById('bairroSelect').value;
    const scroll = document.getElementById('bairrosScroll');
    scroll.innerHTML = '';
    
    const dados = filtro ? todosEnderecos.filter(d => d.bairro === filtro) : todosEnderecos;
    const grupos = {};
    dados.forEach(d => { if(!grupos[d.bairro]) grupos[d.bairro] = []; grupos[d.bairro].push(d); });

    Object.entries(grupos).forEach(([bairro, items]) => {
        const paginas = Math.ceil(items.length / 10);
        for(let p=0; p<paginas; p++) {
            const bloco = items.slice(p*10, (p+1)*10);
            const grupoId = `g_${bairro.replace(/\s/g,'')}_${p}`;
            const card = document.createElement('div');
            card.className = 'grupo-card';
            card.innerHTML = `
                <div class="grupo-header">
                    <div><b>${bairro}</b> (Pág. ${p+1})</div>
                    <button class="btn-pdf" onclick="gerarPDF('${grupoId}', '${bairro}', ${p})">⬇ Gerar PDF</button>
                </div>
                <div class="grupo-map" id="map-${grupoId}"></div>
                <table class="endtable">
                    <thead><tr><th>#</th><th>Endereço</th><th>Esquina</th></tr></thead>
                    <tbody>${bloco.map((item, i) => `<tr><td>${(p*10)+i+1}</td><td>${item.endereco}</td><td>${item.esquina||'-'}</td></tr>`).join('')}</tbody>
                </table>
            `;
            scroll.appendChild(card);
            
            setTimeout(() => {
                const m = L.map(`map-${grupoId}`, {zoomControl:false}).setView([bloco[0].lat, bloco[0].lng], 16);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(m);
                bloco.forEach((item, i) => L.marker([item.lat, item.lng], {icon: pinIcon((p*10)+i+1)}).addTo(m));
                mapsBairro[grupoId] = m;
            }, 100);
        }
    });
}

// FUNÇÃO DE PDF COM AS DATAS EM AZUL NO TOPO DIREITO
async function gerarPDF(grupoId, bairro, pagina) {
    const dataPlanilha = document.getElementById('updateDate').textContent;
    const dataImpressao = new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    
    // Captura o mapa como imagem
    const mapElement = document.getElementById(`map-${grupoId}`);
    const canvas = await html2canvas(mapElement, { useCORS: true });
    const mapImg = canvas.toDataURL('image/jpeg', 0.9);

    const bloco = todosEnderecos.filter(d => d.bairro === bairro).slice(pagina*10, (pagina+1)*10);
    
    const html = `
        <div style="padding:20px; font-family:sans-serif;">
            <div style="display:flex; justify-content:space-between; border-bottom:2px solid #0891b2; padding-bottom:10px; margin-bottom:15px;">
                <div>
                    <h2 style="margin:0; color:#1a2332;">📍 Bairro: ${bairro}</h2>
                    <span style="font-size:12px; color:#666;">Página ${pagina+1}</span>
                </div>
                <div style="text-align:right; color:#0891b2; font-size:10px;">
                    <div style="background:rgba(8,145,178,0.05); padding:5px; border-radius:4px; margin-bottom:4px;">
                        <b>ÚLTIMO CADASTRO:</b> ${dataPlanilha}
                    </div>
                    <b>IMPRESSÃO:</b> ${dataImpressao}
                </div>
            </div>
            <img src="${mapImg}" style="width:100%; border-radius:8px; border:1px solid #ddd; margin-bottom:15px;">
            <table style="width:100%; border-collapse:collapse; font-size:11px;">
                <tr style="background:#f0f0f0;">
                    <th style="padding:8px; border:1px solid #ddd;">#</th>
                    <th style="padding:8px; border:1px solid #ddd;">Endereço</th>
                    <th style="padding:8px; border:1px solid #ddd;">Esquina</th>
                </tr>
                ${bloco.map((item, i) => `
                    <tr>
                        <td style="padding:8px; border:1px solid #ddd; text-align:center;">${(pagina*10)+i+1}</td>
                        <td style="padding:8px; border:1px solid #ddd;">${item.endereco}</td>
                        <td style="padding:8px; border:1px solid #ddd;">${item.esquina||'-'}</td>
                    </tr>
                `).join('')}
            </table>
        </div>
    `;

    const opt = { margin: 10, filename: `Mapa_${bairro}_P${pagina+1}.pdf`, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
    html2pdf().from(html).set(opt).save();
}

function switchTab(tab) {
    document.querySelectorAll('.tab, .panel').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-'+tab).classList.add('active');
    document.getElementById('panel-'+tab).classList.add('active');
    if(tab==='bairros') renderBairros();
}

mapGeral = L.map('map-geral').setView([-23.608, -52.087], 14);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(mapGeral);
carregarDados();
</script>
</body>
</html>
